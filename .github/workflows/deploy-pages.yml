name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual triggering from the Actions tab.
  workflow_dispatch:

# A push to main both builds the new bundle and deploys it.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; queue subsequent pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: examples/web_demo/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Vite build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/web_demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
