[project]
name = "galvani"
version = "0.0.1"
description = "Connectome subgraph to executable rate-model pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "marvosyntactical" }]
keywords = ["connectomics", "neuroscience", "neural-network", "drosophila", "hemibrain"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "platformdirs>=4",
]

[project.optional-dependencies]
neuprint = ["neuprint-python>=0.4.25"]
viz = ["matplotlib>=3.8", "plotly>=5.18", "ipywidgets>=8"]
brian = ["brian2>=2.6"]
all = ["galvani[neuprint,viz,brian]"]

[project.urls]
Repository = "https://github.com/marvosyntactical/galvani"
Issues = "https://github.com/marvosyntactical/galvani/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galvani"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-tqdm",
]
notebook = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "ipywidgets>=8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle + pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "RUF",
]
ignore = ["E501"]         # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]      # asserts in tests are fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# loosen for tests and notebooks
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["neuprint.*", "brian2.*", "plotly.*", "ipywidgets.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: tests that hit external services (neuPrint, etc.); skipped without NEUPRINT_TOKEN",
    "slow: tests that take more than a few seconds (HD-ring validation, gain sweeps)",
]
